<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>校样台 · 标记校样</title>
  <style>
    :root {
      font: 16px/1.5 system-ui, "Microsoft YaHei", sans-serif;
      color: #322521;
      background: #ebe0cd;
      --paper: #fbf4e7;
      --ink: #91372c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      padding: 22px;
      display: grid;
      place-items: center;
      background: repeating-linear-gradient(0deg, transparent 0 31px, #84735a13 31px 32px);
    }

    main {
      width: min(100%, 510px);
      padding: clamp(24px, 6vw, 42px);
      border: 1px solid #6c5849;
      box-shadow: 5px 6px 0 #4e392d1f;
      background: var(--paper);
    }

    h1 {
      margin: 0;
      font: 750 clamp(30px, 6vw, 46px)/1.15 "Songti SC", SimSun, serif;
      letter-spacing: .04em;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-top: 24px;
      padding: 22px 0 10px;
      border-top: 1px solid #b4a38b;
      isolation: isolate;
    }

    .stamp {
      position: relative;
      flex: 0 1 auto;
      min-height: 60px;
      padding: 0 15px;
      border: 0;
      border-radius: 4px;
      background: none;
      color: #5c2d24;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .stamp:focus-visible {
      outline: 2px solid #482c23;
      outline-offset: 7px;
    }

    .stamp-face {
      position: absolute;
      z-index: -1;
      inset: 0;
      border: 2px solid #683027;
      border-radius: inherit;
      background: #f8e6ca;
      box-shadow: inset 0 0 0 3px #fff4de, 0 4px 0 #683027;
      transform-origin: 60% 95%;
      transition: transform 110ms cubic-bezier(.21,.8,.25,1);
      pointer-events: none;
    }

    .stamp[aria-checked="true"] { color: #fff8eb; }

    .stamp[aria-checked="true"] .stamp-face {
      background: var(--ink);
      box-shadow: inset 0 0 0 3px #ffffff28, 0 4px 0 #552720;
    }

    .stamp[data-pressed] .stamp-face { transform: scale(1.07, .81); }
    .stamp[data-impact] .stamp-face { transition: none; }

    .stamp-label {
      display: flex;
      align-items: center;
      gap: 11px;
      position: relative;
      transform: translateY(0);
      transition: transform 110ms ease-out;
      font: 700 clamp(17px, 4vw, 19px)/1 system-ui, "Microsoft YaHei", sans-serif;
      white-space: nowrap;
    }

    .stamp[data-pressed] .stamp-label { transform: translateY(4px); }

    .stamp-glyph {
      display: grid;
      place-items: center;
      width: 23px;
      height: 23px;
      border: 1.5px solid currentColor;
      border-radius: 3px;
    }

    .stamp[aria-checked="true"] .stamp-glyph::before {
      content: "";
      width: 9px;
      height: 5px;
      border: solid currentColor;
      border-width: 0 0 2px 2px;
      transform: translateY(-1px) rotate(-48deg);
    }

    .burst {
      position: absolute;
      pointer-events: none;
      z-index: -2;
      right: -27px;
      bottom: -22px;
      width: 91px;
      height: 85px;
      opacity: 0;
      transform-origin: 44% 50%;
      background: #ba513e;
      clip-path: polygon(31% 32%, 45% 0, 53% 31%, 80% 10%, 71% 39%, 98% 34%, 80% 51%, 100% 64%, 72% 65%, 77% 84%, 55% 74%, 43% 100%, 37% 73%, 21% 83%, 31% 57%, 7% 47%);
    }

    .status {
      flex: none;
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid #b4a38b;
      border-radius: 50px;
      padding: 5px 11px;
      color: #514236;
      background: var(--paper);
      font-weight: 650;
      white-space: nowrap;
    }

    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      border: 1px solid currentColor;
      border-radius: 50%;
    }

    .stamp[aria-checked="true"] + .status { color: #843123; border-color: #b47760; }
    .stamp[aria-checked="true"] + .status::before { background: currentColor; }

    @media (prefers-reduced-motion: reduce) {
      .stamp-face, .stamp-label { transform: none !important; transition: none; }
      .burst { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>校样台</h1>
    <div class="control-row">
      <button class="stamp" type="button" role="switch" aria-checked="false">
        <span class="burst" aria-hidden="true"></span>
        <span class="stamp-face" aria-hidden="true"></span>
        <span class="stamp-label"><span class="stamp-glyph" aria-hidden="true"></span>标记校样</span>
      </button>
      <output class="status" role="status">待校</output>
    </div>
  </main>

  <script>
    const stamp = document.querySelector('.stamp');
    const face = stamp.querySelector('.stamp-face');
    const burst = stamp.querySelector('.burst');
    const status = document.querySelector('.status');
    const preference = matchMedia('(prefers-reduced-motion: reduce)');
    let checked = false;
    let pointer = null;
    let blockedPointer = null;
    let keyboardPress = false;
    let animations = [];

    function clearAnimations() {
      for (const animation of animations) animation.cancel();
      animations = [];
      stamp.removeAttribute('data-impact');
    }

    function showPress() {
      const pointerPress = pointer?.inside && pointer.visual;
      stamp.toggleAttribute('data-pressed', !preference.matches && Boolean(pointerPress || keyboardPress));
    }

    function animateFace(frames, timing) {
      stamp.setAttribute('data-impact', '');
      const animation = face.animate(frames, timing);
      animations.push(animation);
      animation.onfinish = () => {
        if (animations.includes(animation)) stamp.removeAttribute('data-impact');
      };
    }

    function insideButton(event) {
      const rect = stamp.getBoundingClientRect();
      return event.clientX >= rect.left && event.clientX <= rect.right &&
        event.clientY >= rect.top && event.clientY <= rect.bottom;
    }

    function finishPointer(event, cancel = false) {
      if (pointer?.id !== event.pointerId) return;
      if (cancel || !insideButton(event)) blockedPointer = pointer.id;
      pointer = null;
      showPress();
    }

    stamp.addEventListener('pointerdown', event => {
      if (!event.isPrimary || event.button !== 0 || pointer) return;
      blockedPointer = null;
      clearAnimations();
      pointer = { id: event.pointerId, inside: true, visual: !preference.matches };
      showPress();
    });

    window.addEventListener('pointermove', event => {
      if (pointer?.id !== event.pointerId) return;
      pointer.inside = insideButton(event);
      showPress();
    }, true);

    window.addEventListener('pointerup', event => finishPointer(event), true);
    window.addEventListener('pointercancel', event => finishPointer(event, true), true);

    function resetInput() {
      if (pointer) blockedPointer = pointer.id;
      pointer = null;
      keyboardPress = false;
      showPress();
      clearAnimations();
    }

    window.addEventListener('blur', resetInput);
    stamp.addEventListener('blur', resetInput);
    preference.addEventListener('change', () => {
      if (pointer) pointer.visual = false;
      keyboardPress = false;
      showPress();
      clearAnimations();
    });

    stamp.addEventListener('keydown', event => {
      if (event.key === ' ' && !event.repeat) {
        clearAnimations();
        keyboardPress = true;
        showPress();
      }
    });

    stamp.addEventListener('keyup', event => {
      if (event.key === ' ') {
        keyboardPress = false;
        showPress();
      }
    });

    stamp.addEventListener('click', event => {
      if (event.detail > 0 && blockedPointer !== null &&
          (event.pointerId === undefined || event.pointerId === blockedPointer)) return;

      checked = !checked;
      stamp.setAttribute('aria-checked', String(checked));
      status.value = checked ? '已校' : '待校';
      clearAnimations();
      if (preference.matches) return;

      if (!checked) {
        animateFace([
          { transform: 'scale(1.026, .94)' },
          { transform: 'scale(1)' }
        ], { duration: 155, easing: 'cubic-bezier(.18,.7,.25,1)' });
        return;
      }

      animateFace([
        { transform: 'scale(1.04, .89)', offset: 0, easing: 'ease-in' },
        { transform: 'scale(1.11, .74)', offset: .18 },
        { transform: 'scale(1.11, .74)', offset: .27, easing: 'cubic-bezier(.13,.79,.31,1)' },
        { transform: 'scale(.984, 1.055)', offset: .49, easing: 'ease-out' },
        { transform: 'scale(1)', offset: 1 }
      ], 252);

      animations.push(burst.animate([
        { opacity: 0, transform: 'scale(.62)', offset: 0 },
        { opacity: 0, transform: 'scale(.62)', offset: .13 },
        { opacity: 1, transform: 'scale(1)', offset: .18, easing: 'steps(1, end)' },
        { opacity: 1, transform: 'scale(1.06)', offset: .36, easing: 'ease-out' },
        { opacity: 0, transform: 'scale(1.17, .84)', offset: 1 }
      ], 252));
    });
  </script>
</body>
</html>
