<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校样台</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f0e5;
      --sheet: #fffaf0;
      --ink: #29241e;
      --muted: #675b50;
      --red: #90362b;
      --rule: #c6b9a9;
      font-family: system-ui, "Microsoft YaHei", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: var(--paper);
      color: var(--ink);
    }

    main {
      inline-size: min(100%, 570px);
      padding: clamp(25px, 8vw, 54px);
      background: var(--sheet);
      border: 1px solid var(--rule);
      border-top: 6px solid var(--ink);
      box-shadow: 5px 5px 0 #e1d7c7;
    }

    h1 {
      margin: 0 0 10px;
      font: 700 clamp(28px, 7vw, 44px)/1.15 "Songti SC", SimSun, serif;
    }

    p { margin: 0; color: var(--muted); font-size: .92rem; line-height: 1.6; }

    .controls {
      margin-top: 28px;
      padding-top: 25px;
      border-top: 1px solid var(--rule);
      display: grid;
      grid-template-columns: minmax(140px, 205px) auto;
      align-items: center;
      gap: clamp(16px, 5vw, 40px);
    }

    .stamp {
      all: unset;
      box-sizing: border-box;
      position: relative;
      display: grid;
      min-height: 60px;
      place-items: center;
      isolation: isolate;
      border-radius: 4px;
      padding: 0 14px 4px;
      color: var(--ink);
      cursor: pointer;
      font-size: 1.04rem;
      font-weight: 750;
      letter-spacing: .08em;
      text-align: center;
      touch-action: manipulation;
      user-select: none;
    }

    .stamp:focus-visible { outline: 2px solid var(--red); outline-offset: 5px; }
    .stamp-label { z-index: 1; pointer-events: none; }
    .face {
      position: absolute;
      z-index: 0;
      inset: 0 0 4px;
      pointer-events: none;
      transform-origin: 50% 100%;
      background: #ede1cc;
      border: 2px solid var(--ink);
      border-radius: 4px;
      box-shadow: 0 4px 0 var(--ink);
      transition: transform 130ms ease-out, background-color 105ms linear, box-shadow 130ms ease-out;
    }

    .stamp[aria-pressed="true"] .face { background: #f3d7c9; }
    .stamp.is-pressed .face {
      transform: scale(1.052, .78);
      box-shadow: 0 2px 0 var(--ink);
      transition-timing-function: cubic-bezier(.19, .74, .29, 1);
    }

    .ink {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    .ink i {
      position: absolute;
      width: var(--width);
      height: 5px;
      left: var(--x);
      top: var(--y);
      background: var(--red);
      clip-path: polygon(0 28%, 100% 0, 83% 95%, 15% 100%);
      opacity: 0;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 740;
      white-space: nowrap;
    }

    .status.is-marked { color: var(--red); }
    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border: 1px solid currentColor;
      transform: rotate(45deg);
    }
    .status.is-marked::before { background: currentColor; }

    @media (prefers-reduced-motion: reduce) {
      .face { transition: none; }
      .stamp.is-pressed .face { transform: none; }
      .ink { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>校样台</h1>
    <p>复核完成后盖章，可再次按下撤销。</p>
    <div class="controls">
      <button type="button" class="stamp" aria-pressed="false">
        <span class="face" aria-hidden="true"></span>
        <span class="ink" aria-hidden="true">
          <i style="--x: 7%; --y: 17%; --width: 15px" data-vector="-24,-11,-20"></i>
          <i style="--x: -2%; --y: 59%; --width: 19px" data-vector="-20,6,-7"></i>
          <i style="--x: 17%; --y: 74%; --width: 14px" data-vector="-12,20,-40"></i>
          <i style="--x: 85%; --y: 14%; --width: 14px" data-vector="22,-10,-33"></i>
          <i style="--x: 92%; --y: 50%; --width: 19px" data-vector="18,5,8"></i>
          <i style="--x: 76%; --y: 77%; --width: 14px" data-vector="16,19,43"></i>
        </span>
        <span class="stamp-label">标记校样</span>
      </button>
      <span class="status" role="status">待校</span>
    </div>
  </main>
  <script>
    const stamp = document.querySelector('.stamp');
    const face = document.querySelector('.face');
    const status = document.querySelector('.status');
    const strokes = [...document.querySelectorAll('.ink i')];
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    let marked = false;
    let pointer = null;
    let pointerInside = false;
    let rejectPointerClick = false;
    let spaceHeld = false;
    let effects = [];

    function updatePress() {
      stamp.classList.toggle('is-pressed', pointerInside || spaceHeld);
    }

    function stopEffects() {
      for (const effect of effects) effect.cancel();
      effects = [];
    }

    function containsPointer(event) {
      const bounds = stamp.getBoundingClientRect();
      return event.clientX >= bounds.left && event.clientX < bounds.right &&
        event.clientY >= bounds.top && event.clientY < bounds.bottom;
    }

    function endPointer(event, accept) {
      if (event.pointerId !== pointer) return;
      pointer = null;
      pointerInside = false;
      rejectPointerClick = !accept;
      updatePress();
    }

    stamp.addEventListener('pointerdown', event => {
      if (pointer !== null || !event.isPrimary || event.button !== 0) return;
      stopEffects();
      pointer = event.pointerId;
      pointerInside = true;
      rejectPointerClick = false;
      stamp.setPointerCapture(pointer);
      updatePress();
    });

    stamp.addEventListener('pointermove', event => {
      if (pointer !== event.pointerId) return;
      pointerInside = containsPointer(event);
      updatePress();
    });
    stamp.addEventListener('pointerup', event => endPointer(event, containsPointer(event)));
    stamp.addEventListener('pointercancel', event => endPointer(event, false));
    stamp.addEventListener('lostpointercapture', event => endPointer(event, false));

    stamp.addEventListener('keydown', event => {
      if (event.key === 'Enter' && event.repeat) event.preventDefault();
      if (event.key !== ' ' || event.repeat) return;
      stopEffects();
      spaceHeld = true;
      updatePress();
    });
    stamp.addEventListener('keyup', event => {
      if (event.key !== ' ') return;
      spaceHeld = false;
      updatePress();
    });
    stamp.addEventListener('blur', () => {
      spaceHeld = false;
      updatePress();
    });
    window.addEventListener('blur', () => {
      if (pointer !== null) {
        const activePointer = pointer;
        endPointer({ pointerId: activePointer }, false);
        if (stamp.hasPointerCapture(activePointer)) stamp.releasePointerCapture(activePointer);
      }
      spaceHeld = false;
      updatePress();
      stopEffects();
    });

    function playHit() {
      effects.push(face.animate([
        { transform: 'scale(1.085, .69)', backgroundColor: '#eaa992', offset: 0 },
        { transform: 'scale(1.078, .73)', backgroundColor: '#eaa992', offset: .15 },
        { transform: 'scale(.993, 1.045)', backgroundColor: '#f3d7c9', offset: .55 },
        { transform: 'none', backgroundColor: '#f3d7c9', offset: 1 },
      ], { duration: 268, easing: 'cubic-bezier(.18, .54, .31, 1)' }));
      strokes.forEach((stroke, index) => {
        const [x, y, angle] = stroke.dataset.vector.split(',').map(Number);
        const at = (progress, scale) =>
          `translate(${x * progress}px, ${y * progress}px) rotate(${angle}deg) scale(${scale})`;
        effects.push(stroke.animate([
          { transform: at(.36, .85), opacity: 1, offset: 0 },
          { transform: at(.78, 1), opacity: 1, offset: .21 },
          { transform: at(1, 0), opacity: 0, offset: 1 },
        ], { duration: 215 + index * 8, easing: 'ease-out' }));
      });
    }

    stamp.addEventListener('click', event => {
      if (event.detail > 0 && rejectPointerClick) return;
      marked = !marked;
      stamp.setAttribute('aria-pressed', String(marked));
      status.textContent = marked ? '已校' : '待校';
      status.classList.toggle('is-marked', marked);
      stopEffects();
      if (reduced.matches) return;
      if (marked) {
        playHit();
      } else {
        effects.push(face.animate([
          { transform: 'scale(1.016, .95)' },
          { transform: 'none' },
        ], { duration: 145, easing: 'ease-out' }));
      }
    });

    reduced.addEventListener('change', stopEffects);
  </script>
</body>
</html>
