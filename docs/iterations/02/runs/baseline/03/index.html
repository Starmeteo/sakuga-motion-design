<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>纸上工序 · 印刷工作坊</title>
  <style>
    :root {
      --ink: #27251f;
      --paper: #f0e8da;
      --line: #b7aa98;
      --red: #a33328;
      --wash: #e6dac8;
      color: var(--ink);
      background: var(--paper);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1080px, calc(100% - 64px)); margin: 0 auto; padding: 46px 0 54px; }
    header {
      display: flex;
      align-items: center;
      gap: 13px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }
    .mark {
      width: 26px;
      height: 26px;
      flex: 0 0 26px;
      background:
        linear-gradient(var(--red), var(--red)) center / 12px 12px no-repeat,
        linear-gradient(var(--red), var(--red)) center / 2px 100% no-repeat,
        linear-gradient(var(--red), var(--red)) center / 100% 2px no-repeat;
      border: 1px solid var(--red);
      border-radius: 50%;
    }
    .brand { font-size: 1rem; font-weight: 750; letter-spacing: .13em; }
    .panel {
      margin-top: 20px;
      border: 1px solid var(--ink);
      background: #faf3e7;
      box-shadow: 5px 5px 0 var(--ink);
    }
    .commands { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--ink); }
    button {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      min-width: 0;
      min-height: 52px;
      border: 0;
      border-radius: 0;
      color: var(--ink);
      background: var(--wash);
      font: inherit;
      font-weight: 700;
      padding: 6px 4px;
      cursor: pointer;
    }
    button + button { border-inline-start: 1px solid var(--ink); }
    button:hover { background: #fdf3e6; }
    button[aria-pressed="true"] { color: #fff5e8; background: var(--ink); }
    button:focus-visible { position: relative; z-index: 1; outline: 3px solid #db522e; outline-offset: -5px; }
    .digit { font: 500 .75rem ui-monospace, monospace; }
    .content { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); }
    .copy { padding: clamp(24px, 4.5vw, 60px); align-self: center; }
    .copy::before { content: ""; display: block; width: 42px; height: 4px; background: var(--red); margin-bottom: 24px; }
    h1 { margin: 0; font-size: clamp(3.1rem, 7vw, 5.4rem); letter-spacing: -.05em; line-height: 1.14; }
    .description { max-width: 21ch; min-height: 6.35em; margin: 18px 0 0; font-size: 1rem; line-height: 1.8; }
    figure { display: grid; min-width: 0; margin: 0; border-inline-start: 1px solid var(--ink); }
    .stage {
      position: relative;
      align-self: stretch;
      min-width: 0;
      background-color: #ddcfb7;
      background-image: radial-gradient(#a5957f .7px, transparent .8px);
      background-size: 5px 5px;
      overflow: hidden;
      isolation: isolate;
    }
    canvas {
      display: block;
      inline-size: 100%;
      aspect-ratio: 560 / 364;
      transform-origin: 50% 55%;
      position: relative;
      z-index: 1;
      pointer-events: none;
    }
    .speed {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0;
    }
    .speed::before, .speed::after {
      content: "";
      display: block;
      position: absolute;
      left: 7%;
      background: var(--red);
      clip-path: polygon(0 45%, 100% 0, 94% 100%);
      width: 12%;
      height: 3px;
      top: 38%;
    }
    .speed::after { width: 7%; left: 12%; top: 48%; }
    figcaption {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      font-size: .78rem;
      font-weight: 650;
      letter-spacing: .06em;
      background: #faf3e7;
      border-top: 1px solid var(--ink);
    }
    .sample { color: var(--red); }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    @media (max-width: 650px) {
      main { width: calc(100% - 36px); padding-top: 22px; }
      .panel { margin-top: 16px; box-shadow: 4px 4px 0 var(--ink); }
      .content { grid-template-columns: minmax(0, 1fr); }
      .copy { padding: 24px 22px 19px; }
      .copy::before { margin-bottom: 13px; }
      .description { width: 100%; max-width: 26ch; min-height: 3.6em; margin-top: 9px; }
      figure { border-inline-start: 0; border-top: 1px solid var(--ink); }
      button { gap: 7px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="mark" aria-hidden="true"></span>
      <span class="brand">印刷工作坊</span>
    </header>
    <section class="panel" aria-labelledby="chapter-title">
      <nav class="commands" aria-label="工作坊章节">
        <button type="button" aria-pressed="true"><span class="digit" aria-hidden="true">01</span>纸面</button>
        <button type="button" aria-pressed="false"><span class="digit" aria-hidden="true">02</span>走墨</button>
        <button type="button" aria-pressed="false"><span class="digit" aria-hidden="true">03</span>收版</button>
      </nav>
      <div class="content">
        <div class="copy">
          <h1 id="chapter-title">纸面</h1>
          <p class="description">把纸边推到定位线。两处定位记号让下一张纸也能落在同一个位置。</p>
        </div>
        <figure>
          <div class="stage">
            <canvas width="560" height="364" role="img" aria-label="斜放的纸样以两处红色定位记号对齐"></canvas>
            <div class="speed" aria-hidden="true"></div>
          </div>
          <figcaption><span class="sample">图板 01</span><span class="caption">纸张定位</span></figcaption>
        </figure>
      </div>
      <p class="sr-only" role="status"></p>
    </section>
  </main>
  <script>
    const canvas = document.querySelector("canvas");
    const context = canvas.getContext("2d");
    const speedLines = document.querySelector(".speed");
    const title = document.querySelector("h1");
    const description = document.querySelector(".description");
    const caption = document.querySelector(".caption");
    const sample = document.querySelector(".sample");
    const commands = document.querySelector("nav");
    const buttons = Array.from(commands.querySelectorAll("button"));
    const announcement = document.querySelector('[role="status"]');
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
    const palette = { ink: "#292621", red: "#aa3b2a", paper: "#fbedd6", shadow: "#b19b79" };
    const chapters = [
      {
        title: "纸面", description: "把纸边推到定位线。两处定位记号让下一张纸也能落在同一个位置。",
        caption: "纸张定位", illustration: "斜放的纸样以两处红色定位记号对齐", draw: drawPaper
      },
      {
        title: "走墨", description: "沿同一个方向匀速滚过印板，让宽窄不同的纹路都吃上薄薄一层墨。",
        caption: "滚筒布墨", illustration: "滚筒平推，留下有厚薄变化的红色墨带", draw: drawInk
      },
      {
        title: "收版", description: "捏住纸角慢慢揭开。等印纹晾干，再把这一批印样叠齐归档。",
        caption: "揭纸收样", illustration: "掀起的一角露出带有红色拱形纹样的印纸", draw: drawPrint
      }
    ];
    let current = 0;
    let visualBatch = [];

    function polygon(points, fill, stroke = palette.ink, width = 2.4) {
      context.beginPath();
      for (const [index, [x, y]] of points.entries()) {
        if (index === 0) context.moveTo(x, y);
        else context.lineTo(x, y);
      }
      context.closePath();
      context.fillStyle = fill;
      context.fill();
      if (stroke) {
        context.strokeStyle = stroke;
        context.lineWidth = width;
        context.stroke();
      }
    }

    function line(points, color = palette.ink, width = 2) {
      context.strokeStyle = color;
      context.lineWidth = width;
      context.beginPath();
      context.moveTo(...points[0]);
      for (const point of points.slice(1)) context.lineTo(...point);
      context.stroke();
    }

    function guides() {
      for (const [x, y] of [[52, 47], [509, 47], [52, 317], [509, 317]]) {
        line([[x - 9, y], [x + 9, y]], palette.ink, 1);
        line([[x, y - 9], [x, y + 9]], palette.ink, 1);
      }
    }

    function drawPaper() {
      polygon([[145, 112], [398, 73], [465, 252], [201, 294]], palette.shadow, null);
      polygon([[125, 105], [380, 61], [449, 241], [180, 285]], "#c8b18d");
      polygon([[113, 92], [371, 53], [435, 225], [172, 270]], palette.paper);
      for (let i = 0; i < 8; i++) {
        const y = 117 + i * 13;
        const x = 154 + i * 4.6;
        line([[x, y], [x + 183, y - 28]], "#cdb69b", i === 0 || i === 7 ? 2 : 1);
      }
      polygon([[125, 97], [144, 94], [146, 100], [128, 103], [133, 121], [126, 122]], palette.red, null);
      polygon([[406, 224], [424, 220], [419, 201], [425, 200], [432, 224], [408, 230]], palette.red, null);
    }

    function drawInk() {
      polygon([[103, 118], [366, 72], [475, 242], [191, 293]], palette.shadow, null);
      polygon([[94, 111], [355, 67], [460, 230], [180, 283]], palette.paper);
      polygon([[114, 130], [356, 87], [413, 174], [165, 218], [174, 206], [160, 209], [144, 192]], palette.red, null);
      for (let i = 0; i < 7; i++) {
        const x = 172 + i * 7;
        line([[x, 208 + i * 2], [x + 120 + i * 13, 186 - i * .8]], "#702f25", 1.8);
      }
      polygon([[153, 170], [398, 127], [415, 147], [411, 171], [170, 214], [155, 204], [146, 185]], "#312b25");
      polygon([[152, 169], [395, 126], [407, 137], [162, 181]], "#847361", null);
      polygon([[161, 181], [405, 138], [411, 153], [169, 196]], "#423830", null);
      polygon([[398, 129], [411, 140], [416, 157], [410, 172], [398, 170], [390, 150]], "#c5a479");
      line([[405, 153], [448, 147], [470, 114]], palette.ink, 5);
      polygon([[456, 112], [476, 79], [496, 90], [476, 124]], palette.red);
    }

    function drawPrint() {
      polygon([[118, 118], [374, 74], [457, 245], [193, 292]], palette.shadow, null);
      polygon([[105, 102], [360, 61], [444, 231], [178, 278]], "#694634");
      polygon([[107, 104], [358, 65], [426, 184], [427, 206], [179, 262]], palette.paper);
      context.save();
      context.translate(275, 163);
      context.transform(1, -.16, .44, .71, 0, 0);
      context.lineWidth = 12;
      context.strokeStyle = palette.red;
      for (const radius of [64, 45, 26]) {
        context.beginPath();
        context.arc(0, 6, radius, Math.PI, Math.PI * 2);
        context.stroke();
        line([[-radius, 6], [-radius, 27]], palette.red, 12);
        line([[radius, 6], [radius, 27]], palette.red, 12);
      }
      line([[-70, 46], [70, 46]], palette.red, 4);
      context.restore();
      polygon([[372, 219], [374, 192], [425, 184], [427, 206]], "#dabd98");
      line([[378, 193], [420, 186]], "#f8e7ca", 2);
    }

    function renderArt() {
      const scale = Math.min(devicePixelRatio || 1, 3);
      const width = Math.max(1, Math.round(canvas.clientWidth * scale));
      const height = Math.round(width * 364 / 560);
      canvas.width = width;
      canvas.height = height;
      context.setTransform(width / 560, 0, 0, height / 364, 0, 0);
      context.lineJoin = "round";
      context.lineCap = "round";
      guides();
      chapters[current].draw();
    }

    function stopReveal() {
      for (const animation of visualBatch) animation.cancel();
      visualBatch = [];
    }

    function reveal(direction) {
      const distance = direction * Math.min(54, canvas.clientWidth * .087);
      const plate = canvas.animate([
        { transform: `translateX(${distance}px) scale(1.12, .93) rotate(${direction * -4}deg)`, easing: "cubic-bezier(.22,.70,.26,1)" },
        { transform: `translateX(${distance * -.18}px) scale(.98, 1.02) rotate(${direction}deg)`, offset: .49, easing: "ease-out" },
        { transform: `translateX(${distance * .048}px) scale(1.012, .994)`, offset: .72 },
        { transform: "none" }
      ], { duration: 365 });
      const tail = speedLines.animate([
        { transform: `scaleX(${-direction})`, opacity: .9 },
        { transform: `translateX(${direction * -14}px) scaleX(${-direction})`, opacity: .63, offset: .28 },
        { transform: `translateX(${direction * -30}px) scaleX(${-direction})`, opacity: 0 }
      ], { duration: 174, easing: "ease-out" });
      visualBatch = [plate, tail];
    }

    function choose(index) {
      if (index === current) return;
      const direction = Math.sign(index - current);
      const chapter = chapters[index];
      stopReveal();
      current = index;
      title.textContent = chapter.title;
      description.textContent = chapter.description;
      caption.textContent = chapter.caption;
      sample.textContent = `图板 0${index + 1}`;
      canvas.setAttribute("aria-label", chapter.illustration);
      buttons.forEach((button, i) => button.setAttribute("aria-pressed", String(i === index)));
      announcement.textContent = `当前章节：${chapter.title}`;
      renderArt();
      if (!reducedMotion.matches) reveal(direction);
    }

    buttons.forEach((button, index) => button.addEventListener("click", () => choose(index)));
    commands.addEventListener("keydown", (event) => {
      const index = buttons.indexOf(event.target);
      if (index < 0 || event.altKey || event.metaKey || event.ctrlKey || event.shiftKey) return;
      let next;
      if (event.key === "ArrowLeft") next = Math.max(0, index - 1);
      else if (event.key === "ArrowRight") next = Math.min(buttons.length - 1, index + 1);
      else if (event.key === "Home") next = 0;
      else if (event.key === "End") next = buttons.length - 1;
      else return;
      event.preventDefault();
      buttons[next].focus();
      choose(next);
    });
    reducedMotion.addEventListener("change", (event) => {
      if (event.matches) stopReveal();
    });
    window.addEventListener("pagehide", stopReveal);
    new ResizeObserver(renderArt).observe(canvas);
    renderArt();
  </script>
</body>
</html>
